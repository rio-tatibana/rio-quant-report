name: Publish Japan equity report

on:
  workflow_dispatch:
  schedule:
    # 18:17 JST（月〜金）。毎時00分の混雑を避けるため17分に実行する。
    - cron: '17 9 * * 1-5'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NTFY_URL: ${{ secrets.NTFY_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install free data libraries
        run: pip install -r requirements.txt
      - name: Generate report data
        run: python scripts/generate_japan_report.py
      - name: Commit updated report data
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan
          git commit -m "chore: update Japan equity report"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Notify the published report through ntfy
        if: steps.changes.outputs.changed == 'true' && env.NTFY_URL != ''
        env:
          REPORT_URL: https://rio-tatibana.github.io/rio-quant-report/japan-report.html
        run: |
          curl --fail --silent --show-error \
            -H "Title: 日本株レポートを更新しました" \
            -H "Click: $REPORT_URL" \
            -d "無料データ（Yahoo Finance・TDnet）で日本株レポートを更新しました。" \
            "$NTFY_URL"
      # Secretに混入した空白・改行・制御文字を取り除いてから使う。コピペ事故で
      # URLが複数行になると curl が "Malformed input to a URL function" で落ちるため。
      # 加工後は元のSecretと文字列が一致せず自動マスクが効かないので、add-maskで再登録する。
      - name: Normalize NTFY_URL (the value is never printed)
        if: env.NTFY_URL != ''
        run: |
          normalized=$(printf '%s' "$NTFY_URL" | tr -d '[:space:]')
          echo "::add-mask::$normalized"
          echo "NTFY_URL=$normalized" >> "$GITHUB_ENV"
          if [ "$normalized" = "$NTFY_URL" ]; then
            echo "空白の混入なし。そのまま使用します。"
          else
            echo "空白・改行を除去しました（値は表示しません）。"
          fi

      # NTFY_URLの形を手動実行時だけ検査する。値そのものは絶対に出力せず、
      # 判定結果（OK/NG）だけを表示する。curlのURL不正エラーの原因切り分け用。
      - name: Check the shape of NTFY_URL (the value is never printed)
        if: github.event_name == 'workflow_dispatch' && env.NTFY_URL != ''
        run: |
          url="$NTFY_URL"
          case "$url" in
            https://ntfy.sh/*) echo "形式: https://ntfy.sh/... で始まる → OK" ;;
            https://*)         echo "形式: httpsだがntfy.sh以外のホスト → 自前サーバーなら問題なし" ;;
            http://*)          echo "形式: httpで始まる → NG（httpsにする）" ;;
            *)                 echo "形式: スキーム(https://)が無い → NG" ;;
          esac
          if printf '%s' "$url" | LC_ALL=C grep -q '[^ -~]'; then
            echo "文字種: 非ASCII（全角・日本語など）を含む → NG。これがURL不正の原因"
          else
            echo "文字種: 半角ASCIIのみ → OK"
          fi
          if printf '%s' "$url" | LC_ALL=C grep -q '[[:space:]]'; then
            echo "空白: スペースまたは改行を含む → NG"
          else
            echo "空白: なし → OK"
          fi
          echo "末尾の文字が英数字か: $(printf '%s' "$url" | LC_ALL=C grep -qE '[A-Za-z0-9]$' && echo 'OK' || echo 'NG（記号や不可視文字で終わっている）')"

      # 手動実行のときだけ送る通知テスト。ntfyは存在しないトピック名にも成功を返すため、
      # 実際に届くかはこうして送ってみないと確認できない。定時実行では送らない。
      - name: Send a test notification on manual runs
        if: github.event_name == 'workflow_dispatch' && env.NTFY_URL != ''
        env:
          REPORT_URL: https://rio-tatibana.github.io/rio-quant-report/japan-report.html
        run: |
          curl --fail --silent --show-error \
            -H "Title: 日本株レポートの通知テスト" \
            -H "Click: $REPORT_URL" \
            -d "手動実行によるテストです。これが届けば、更新通知の設定は正常です。" \
            "$NTFY_URL"

      - name: Notify workflow failure through ntfy
        if: failure() && env.NTFY_URL != ''
        env:
          ACTIONS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -H "Title: 日本株レポートの更新に失敗しました" \
            -H "Click: $ACTIONS_URL" \
            -H "Priority: high" \
            -d "GitHub Actionsの実行ログを確認してください。" \
            "$NTFY_URL"
